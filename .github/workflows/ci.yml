name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ '18', '22' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript build (tsc)
        run: npm run build

      - name: Run module load & unit tests
        run: |
          node << 'EOF'
          const assert = require('assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');

          // 1. Verify compiled core modules load cleanly without runtime errors
          const { CategoryClassifier } = require('./dist/services/CategoryClassifier');
          const { SessionManager } = require('./dist/services/SessionManager');
          const { upsertEnvVar, atomicWriteFileSync } = require('./dist/utils/FileUtils');
          const { LlmClientFactory } = require('./dist/utils/LlmClientFactory');
          require('./dist/services/UserManager');
          require('./dist/services/ChannelManager');
          require('./dist/services/DoubanService');
          require('./dist/services/AntiCensorService');
          require('./dist/services/AiCorrector');
          require('./dist/services/AiRecommender');
          require('./dist/services/Searcher');
          require('./dist/services/QuarkService');
          require('./dist/services/SchedulerService');
          require('./dist/commands/CommandHandler');
          require('./dist/agent/DeepSeekAgent');
          require('./dist/wechat/WeixinBot');
          const { MetadataResolver } = require('./dist/services/MetadataResolver');
          const { ResourceSearcher } = require('./dist/services/Searcher');

          // 2. CategoryClassifier tests
          assert.strictEqual(CategoryClassifier.classify('沙丘2 2024 4K电影'), '电影');
          assert.strictEqual(CategoryClassifier.classify('庆余年 第二季 全集 电视剧'), '国产剧');
          assert.strictEqual(CategoryClassifier.classify('怪奇物语 第四季 Netflix'), '美剧');
          assert.strictEqual(CategoryClassifier.classify('眼泪之女王 tvN 韩剧'), '韩剧');
          assert.strictEqual(CategoryClassifier.classify('进击的巨人 最终季 动漫'), '动漫');

          // 3. FileUtils tests ($ replacement safety + atomic write)
          const tmpDir = fs.mkdtempSync(path.join(os.tmpdir(), 'wesaver-ci-'));
          const envFile = path.join(tmpDir, '.env');
          upsertEnvVar(envFile, 'QUARK_COOKIE', 'abc$1$$xyz=123');
          upsertEnvVar(envFile, 'QUARK_COOKIE', 'updated$&val');
          assert(fs.readFileSync(envFile, 'utf8').includes('QUARK_COOKIE=updated$&val'));
          const jsonFile = path.join(tmpDir, 'test.json');
          atomicWriteFileSync(jsonFile, '{"ok":true}');
          assert.strictEqual(fs.readFileSync(jsonFile, 'utf8'), '{"ok":true}');
          fs.rmSync(tmpDir, { recursive: true, force: true });

          // 4. SessionManager tests
          const sm = new SessionManager();
          sm.setSearch('u1', '测试剧', [{ title: '测试剧', url: 'https://pan.quark.cn/s/1', source: 'quark', channel: 'c1' }]);
          assert.strictEqual(sm.getSearch('u1').keyword, '测试剧');
          assert.strictEqual(sm.getLastActiveType('u1'), 'search');

          // 5. LlmClientFactory defaults check
          assert.strictEqual(LlmClientFactory.getDefaultModel(), 'deepseek-flash');
          assert.strictEqual(LlmClientFactory.getVisionModel(), 'deepseek-flash');

          // 6. WeixinBot long-message chunking check
          const { WeixinBot } = require('./dist/wechat/WeixinBot');
          const chunks = WeixinBot.prototype.splitMessageChunks('line\n'.repeat(600), 1800);
          assert(chunks.length >= 2 && chunks.every((c) => c.length > 0 && c.length <= 1800));

          // 7. MetadataResolver & Searcher multi-title merge checks
          assert.strictEqual(MetadataResolver.hasForeignScript('君の名は'), true);
          assert.strictEqual(MetadataResolver.hasForeignScript('Inception'), true);
          assert.strictEqual(MetadataResolver.hasForeignScript('庆余年 4K'), false);
          assert.strictEqual(MetadataResolver.getInstance().hasTmdbConfigured(), false);
          const searcher = new ResourceSearcher(['Quark_Movies']);
          const merged = searcher.mergeResults(
            { keyword: '突如其来', items: [{ title: '突然身体不适 4K', shareUrl: 'https://pan.quark.cn/s/dup1', shareId: 'dup1', panType: 'quark', rawText: 'alias match' }], totalFound: 1, durationMs: 10 },
            [{ keyword: '突如其来', items: [{ title: '突如其来 1080P', shareUrl: 'https://pan.quark.cn/s/main2', shareId: 'main2', panType: 'quark', rawText: '' }, { title: '突然身体不适', shareUrl: 'https://pan.quark.cn/s/dup1', shareId: 'dup1', panType: 'quark', rawText: '' }], totalFound: 2, durationMs: 12 }],
            '突如其来',
            undefined,
            ['突然身体不适']
          );
          assert.strictEqual(merged.items.length, 2);
          assert.strictEqual(merged.items[0].shareId, 'main2');

          // 8. PendingImageSearch state & confirmation matching check
          const smGlobal = SessionManager.getInstance();
          smGlobal.setPendingImageSearch('img_u1', {
            standardTitle: '突如其来',
            originalTitle: '急に具合が悪くなる',
            aliases: ['All of a Sudden'],
            year: '2026',
            mediaType: 'movie',
          });
          assert.strictEqual(smGlobal.getPendingImageSearch('img_u1').standardTitle, '突如其来');
          const { DeepSeekAgent } = require('./dist/agent/DeepSeekAgent');
          const dummyAgent = new DeepSeekAgent('dummy');
          assert.strictEqual(dummyAgent.isPendingImageSearchConfirm('img_u1', '搜索'), true);
          assert.strictEqual(dummyAgent.isPendingImageSearchConfirm('img_u1', '好的'), true);
          assert.strictEqual(dummyAgent.isPendingImageSearchConfirm('img_u1', '不用了'), false);
          smGlobal.clearPendingImageSearch('img_u1');
          assert.strictEqual(smGlobal.getPendingImageSearch('img_u1'), undefined);

          console.log('ALL_CI_CHECKS_PASSED');
          EOF
